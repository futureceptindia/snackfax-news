<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snackfax</title>
<style>
:root{
  --red:#E8202A; --ink:#0F1115; --ink-2:#3C424E; --ink-3:#7B8394;
  --line:#E6E8EC; --bg:#fff; --soft:#F6F7F9; --soft-red:#FDEEEF; --soft-green:#EDF7F1;
  --green:#1B8A54; --purple:#6D3BD6; --blue:#1B63C4;
  --r:14px; --shadow:0 1px 2px rgba(15,17,21,.06), 0 8px 24px rgba(15,17,21,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--ink);background:#EFF1F4}
img{display:block;max-width:100%}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;text-align:left}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;padding:5px 10px;border-radius:6px;background:var(--red);color:#fff}
.tag.g{background:#12A05C}.tag.y{background:#F2B705;color:#3a2b00}.tag.p{background:#6D3BD6}
.tag.b{background:#1B63C4}.tag.k{background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.tag.o{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--red);margin-bottom:6px}

/* prototype bar */
.proto{position:sticky;top:0;z-index:300;background:#111319;color:#fff;display:flex;gap:10px;align-items:center;padding:8px 16px;font-size:12.5px}
.proto b{letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#8b93a4}
.proto .seg{display:flex;background:#1E212A;border-radius:999px;padding:3px}
.proto .seg button{padding:5px 12px;border-radius:999px;color:#b8bfcc}
.proto .seg button.on{background:#fff;color:#111}
.proto .hint{margin-left:auto;color:#6d7484}

/* ticker */
.ticker{background:var(--ink);color:#fff;font-size:13px}
.ticker .wrap{display:flex;align-items:center;gap:14px;height:38px}
.livedot{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:11px;letter-spacing:.08em;color:#fff;background:var(--red);padding:3px 9px;border-radius:999px;flex:none}
.livedot i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blip 1.2s infinite}
@keyframes blip{50%{opacity:.25}}
.tk{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:20px}
.tk button{position:absolute;inset:0;opacity:0;transition:.4s;transform:translateY(8px);color:#D7DBE3;white-space:nowrap}
.tk button.on{opacity:1;transform:none}
.tk b{color:#fff}

/* header */
header.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:33px;z-index:200}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{font-weight:900;font-size:25px;letter-spacing:-.02em;color:var(--red);line-height:1}
.logo small{display:block;font-size:8.2px;letter-spacing:.12em;color:var(--ink);font-weight:700;margin-top:2px}
nav.main{display:flex;gap:18px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
nav.main button{padding:22px 0;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.main button.on{color:var(--red);border-color:var(--red)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn-sub{background:var(--red);color:#fff;font-weight:700;padding:9px 18px;border-radius:999px;font-size:14px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--soft)}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--red);z-index:400;width:0;transition:width .1s}

/* generic bits */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
.sec-head h2{font-size:26px;letter-spacing:-.02em;margin:0}
.sec-head button.all{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cols{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.crumb{font-size:13px;color:var(--ink-3);padding:16px 0 0}
.crumb button{color:var(--red);font-weight:600}

.story{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;width:100%;text-align:left}
.story .ph{height:118px;background:var(--img) center/cover;background-color:#DDE1E6}
.story .bd{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}
.story h3{font-size:15px;line-height:1.28;margin:8px 0 0;letter-spacing:-.01em}
.story .foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:12px;font-size:12.5px;color:var(--ink-3)}
.story .hrow{display:flex;justify-content:space-between;align-items:center}
.story .hrow .t{font-size:12px;color:var(--ink-3)}
.story:hover h3{color:var(--red)}
.bm{margin-left:auto}.bm.on{color:var(--red)}

.rowcard{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rowcard .tx{flex:1}
.rowcard h3{margin:7px 0 6px;font-size:18px;line-height:1.3;letter-spacing:-.01em}
.rowcard p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.rowcard .mt{font-size:12.5px;color:var(--ink-3)}
.rowcard .th{width:170px;height:112px;border-radius:10px;background:var(--img) center/cover;background-color:#DDE1E6;flex:none}
.rowcard:hover h3{color:var(--red)}

/* hero */
.hero{display:grid;grid-template-columns:1.55fr 1fr .85fr;gap:16px;padding:20px 0}
.big{position:relative;min-height:470px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);width:100%;
  background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.05) 35%,rgba(0,0,0,.82)),var(--img) center/cover;background-color:#2a2d34}
.big .toprow{position:absolute;top:22px;left:26px;right:26px;display:flex;align-items:center}
.big .stamp{margin-left:auto;font-size:12.5px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:5px 11px;border-radius:999px}
.big h1{font-size:40px;line-height:1.08;letter-spacing:-.02em;margin:0 0 12px;max-width:16ch}
.big p{margin:0 0 20px;max-width:46ch;color:#DDE1E8;font-size:15px}
.play{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 18px 9px 9px;border-radius:999px;font-weight:600}
.play i{width:32px;height:32px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-style:normal;font-size:12px;padding-left:2px}
.dots{display:flex;gap:5px;position:absolute;bottom:14px;left:26px}
.dots b{width:44px;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
.dots b.on{background:var(--red)}
.stack{display:grid;grid-template-rows:repeat(3,1fr);gap:16px}
.mini{position:relative;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:145px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);width:100%;
  background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.75)),var(--img) center/cover;background-color:#2a2d34}
.mini .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mini h3{font-size:17px;line-height:1.2;margin:8px 0;letter-spacing:-.01em}
.mini .meta,.pill-time{font-size:12px;color:#E4E7EC}
.mini .meta i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);display:inline-grid;place-items:center;font-style:normal;font-size:9px;vertical-align:middle;margin-right:5px}

.latest{background:var(--soft-red);border-radius:var(--r);padding:18px 18px 16px}
.latest h4{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:7px}
.latest h4 span{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-weight:500}
.feed{position:relative;padding-left:14px}
.feed:before{content:"";position:absolute;left:3px;top:6px;bottom:18px;width:1px;background:#F3C6C9}
.feed .it{position:relative;padding:0 0 15px;display:block;width:100%}
.feed .it:before{content:"";position:absolute;left:-14px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--soft-red)}
.feed .it.new:before{animation:blip 1.4s infinite}
.feed time{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.feed p{margin:0;font-size:14.5px;font-weight:600;line-height:1.35}
.feed .it:hover p{color:var(--red)}
.more{width:100%;border:1px solid #F0B9BD;color:var(--red);font-weight:700;padding:9px;border-radius:9px;font-size:13.5px;text-align:center}

/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:78px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip em{display:block;font-size:17px;font-style:normal;margin-bottom:5px}
.chip.on{background:var(--soft-red);border-color:#F4C3C6;color:var(--red)}

/* format blocks */
.fmt{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.fmt h2{margin:0 0 3px;font-size:22px;letter-spacing:-.02em}
.fmt .sub{margin:0 0 16px;color:var(--ink-3);font-size:13.5px}

.brief{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brief .art{width:96px;height:96px;border-radius:12px;background:linear-gradient(135deg,var(--red),#7A0E15);color:#fff;display:grid;place-content:center;text-align:center;font-weight:800;font-size:13px;line-height:1.2;flex:none}
.brief .mid{flex:1;min-width:250px}
.wave{display:flex;align-items:flex-end;gap:2px;height:38px;margin:8px 0;width:100%}
.wave b{flex:1;background:#E3E6EB;border-radius:2px}
.wave b.p{background:var(--red)}
.ctrls{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.ctrls .pp{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px}
.speed{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chapters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chapters button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
.chapters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.reel{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.short{flex:none;width:168px;height:296px;border-radius:12px;scroll-snap-align:start;position:relative;color:#fff;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow);
  background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.8)),var(--img) center/cover;background-color:#2a2d34}
.short h4{margin:0;font-size:14px;line-height:1.25}
.short .dur{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
.short .st{font-size:11.5px;color:#D9DDE4;margin-top:6px}
.short.live:before{content:"● LIVE";position:absolute;top:10px;left:10px;background:var(--red);font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px}

.ask{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--soft)}
.ask .q{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ask .q button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink-2)}
.ask .q button:hover{border-color:var(--red);color:var(--red)}
.ans{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;min-height:64px}
.ans .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--purple);margin-bottom:6px}
.ans ul{margin:8px 0 0;padding-left:18px;color:var(--ink-2)}
.ans .src{margin-top:10px;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:8px}
.typing b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-3);margin-right:3px;animation:bob .9s infinite}
.typing b:nth-child(2){animation-delay:.15s}.typing b:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px)}}

.deck{position:relative;height:250px;max-width:400px;margin:0 auto}
.deck .sw{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);transition:.3s;display:flex;flex-direction:column}
.deck .sw h3{margin:10px 0 8px;font-size:20px;line-height:1.25}
.deck .sw p{margin:0;color:var(--ink-2);font-size:14px}
.deck .sw .n{margin-top:auto;font-size:12px;color:var(--ink-3)}
.deck-ctrl{display:flex;gap:10px;justify-content:center;margin-top:14px}
.deck-ctrl button{border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:600;font-size:13.5px;background:#fff}
.deck-ctrl .save{background:var(--ink);color:#fff;border-color:var(--ink)}

.poll .opt{position:relative;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:14px;font-weight:600;overflow:hidden;background:#fff;width:100%;display:flex}
.poll .opt .fill{position:absolute;inset:0;width:0;background:var(--soft-red);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.poll .opt span{position:relative}
.poll .opt .pct{margin-left:auto;color:var(--red);opacity:0;transition:.3s}
.poll.voted .opt .pct{opacity:1}
.poll .tot{font-size:12.5px;color:var(--ink-3)}

.live-log{border-left:2px solid var(--line);padding-left:16px;margin-top:4px}
.live-log .e{position:relative;padding-bottom:16px}
.live-log .e:before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--ink-3)}
.live-log .e.hot:before{background:var(--red);border-color:var(--red)}
.live-log time{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.live-log p{margin:3px 0 0;font-size:14px}
.live-log .e.fresh{animation:slidein .5s}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}}

.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.num{border:1px solid var(--line);border-radius:12px;padding:14px}
.num b{display:block;font-size:26px;letter-spacing:-.02em}
.num i{font-style:normal;font-size:12px;font-weight:700}
.num i.up{color:var(--green)}.num i.dn{color:var(--red)}
.num p{margin:4px 0 0;font-size:12.5px;color:var(--ink-3)}

.vid{border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);width:100%;text-align:left}
.vid .ph{position:relative;height:150px;background:var(--img) center/cover;background-color:#DDE1E6;display:grid;place-items:center;color:#fff;font-size:26px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.vid .ph .d{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:4px}
.vid .bd{padding:10px 12px 14px}
.vid h4{margin:0 0 6px;font-size:14.5px;line-height:1.3}
.vid p{margin:0;font-size:12.5px;color:var(--ink-3)}

/* sidebar */
.side-card{border-radius:var(--r);padding:18px;color:#fff;background:var(--red)}
.side-card h3{margin:0 0 4px;font-size:19px;line-height:1.25}
.side-card p{margin:0 0 12px;font-size:13px;color:#FFD9DB}
.mailrow{display:flex;background:#fff;border-radius:9px;padding:4px 4px 4px 12px;align-items:center}
.mailrow input{border:0;outline:0;flex:1;font-size:13.5px}
.mailrow button{width:34px;height:34px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center}
.wa{background:var(--soft-green);border-radius:var(--r);padding:18px;margin-top:16px}
.wa h3{margin:0 0 6px;font-size:16px}
.wa p{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.wa .jn{border:1px solid #BFE0CD;background:#fff;color:var(--green);font-weight:700;padding:8px 16px;border-radius:8px;font-size:13.5px}

/* article */
.art-wrap{max-width:720px;margin:0 auto}
.art-hero{border-radius:var(--r);height:380px;background:var(--img) center/cover;background-color:#DDE1E6;margin:14px 0 22px;box-shadow:var(--shadow)}
.art h1{font-size:40px;line-height:1.1;letter-spacing:-.025em;margin:12px 0 12px}
.art .dek{font-size:18px;color:var(--ink-2);margin:0 0 18px}
.byline{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:20px;flex-wrap:wrap}
.byline .av{width:34px;height:34px;border-radius:50%;background:var(--img) center/cover;background-color:#CDD2DA}
.byline .nm{color:var(--ink);font-weight:700}
.byline .acts{margin-left:auto;display:flex;gap:8px}
.byline .acts button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.art p.body{font-size:17px;line-height:1.72;margin:0 0 20px;color:#1B1E25}
.art h2.sub2{font-size:22px;letter-spacing:-.015em;margin:30px 0 12px}
.keypoints{background:var(--soft);border-left:3px solid var(--red);border-radius:0 12px 12px 0;padding:16px 18px;margin:0 0 24px}
.keypoints h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--red)}
.keypoints ul{margin:0;padding-left:18px;font-size:15px;line-height:1.7;color:var(--ink-2)}
.pullq{border-left:3px solid var(--ink);padding:4px 0 4px 18px;margin:26px 0;font-size:21px;line-height:1.4;letter-spacing:-.01em}
.listen{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:24px}
.listen .pp{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.listen b{display:block;font-size:14px}.listen span{font-size:12.5px;color:var(--ink-3)}

/* shorts full page */
.shorts-page{max-width:420px;margin:0 auto;height:calc(100vh - 160px);overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:18px;scrollbar-width:none;box-shadow:var(--shadow)}
.shorts-page::-webkit-scrollbar{display:none}
.sp{height:100%;scroll-snap-align:start;position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 76px 26px 20px;
  background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.85)),var(--img) center/cover;background-color:#2a2d34}
.sp h3{margin:8px 0 6px;font-size:22px;line-height:1.2}
.sp p{margin:0;font-size:13.5px;color:#DDE1E8}
.sp .rail{position:absolute;right:14px;bottom:30px;display:flex;flex-direction:column;gap:18px;text-align:center;font-size:11px}
.sp .rail button em{display:block;font-style:normal;font-size:21px;margin-bottom:2px}
.sp .pr{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2)}
.sp .pr b{display:block;height:100%;width:38%;background:var(--red)}

/* founders / podcasts */
.person{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;text-align:left;width:100%}
.person .av{width:56px;height:56px;border-radius:50%;background:var(--img) center/cover;background-color:#CDD2DA;margin-bottom:10px}
.person h3{margin:0 0 3px;font-size:16px}
.person .role{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.person p{margin:0;font-size:13.5px;color:var(--ink-2)}
.ep{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.ep .cv{width:74px;height:74px;border-radius:10px;background:linear-gradient(135deg,var(--red),#7A0E15);color:#fff;display:grid;place-content:center;font-weight:800;font-size:12px;text-align:center;flex:none}

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=n=>`img/${n}.jpg`;

/* ------------------------------------------------ DATA */
const SECTIONS=[
  {id:'justin',name:'Just In'},{id:'technology',name:'Technology'},{id:'brands',name:'Brands'},{id:'retail',name:'Retail'},
  {id:'money',name:'Money'},{id:'trends',name:'Trends'},{id:'founders',name:'Founders'},
  {id:'videos',name:'Videos'},{id:'podcasts',name:'Podcasts'}
];
const CHIPS=[['all','All','▦'],['breaking','Breaking','⚡'],['technology','Technology','⚙'],['brands','Brands','🏷'],['retail','Retail','🏬'],
  ['money','Money','📊'],['trends','Trends','↗'],['founders','Founders','👥'],['products','Products','📦'],
  ['policy','Policy','📄'],['global','Global','🌐']];
const TAGC={MONEY:'',RETAIL:'y',TRENDS:'p','FOUNDER TAKE':'p',BRANDS:'b',POLICY:'b',GLOBAL:'g',BREAKING:'',PRODUCTS:'g','JUST IN':''};

const SECBLURB={
  technology:'The systems underneath Indian food and retail — pricing engines, dark-store software, demand forecasting, and the AI everyone is piloting but few are running.',
  brands:'What Indians put in the trolley, who makes it, and the distribution fights that decide which brand takes the shelf.',
  retail:'Store formats, quick commerce and the economics of getting a product into someone\'s hands in ten minutes.',
  money:'Rounds, valuations and margins. We read the cap table, not the press release.',
  trends:'The categories moving fastest, and an honest read on which are real.',
  founders:'Operators on the decisions that shaped the business, including the ones that did not work.',
  justin:'Everything Snackfax has published, newest first.'
};
const AUTHORS={
  ra:{id:'ra',name:'Rhea Anand',role:'Retail & quick commerce',img:I('founder'),bio:'Six years covering Indian grocery retail. Before Snackfax, she tracked supply chains at a trade weekly.'},
  km:{id:'km',name:'Kabir Mehta',role:'Brands & consumer',img:I('founder2'),bio:'Writes about what Indians put in their trolley and why. Previously a category manager at an FMCG major.'},
  sn:{id:'sn',name:'Simran Nair',role:'Money & deals',img:I('salad'),bio:'Follows the cheques — rounds, valuations and the unit economics behind them.'},
  dv:{id:'dv',name:'Dev Iyer',role:'Technology',img:I('dark'),bio:'Covers the software layer: pricing engines, forecasting, and which AI pilots actually reached production.'}
};

const P=(...a)=>a;
const STORIES=[
 {id:'agentic-grocery',sec:'technology',tag:'TECHNOLOGY',t:'Zepto, BigBasket and Swiggy are all building shopping assistants. None will let one press buy.',
  dek:'Three platforms outlined how far they will let an assistant go. Every one stopped at the same wall: who owns the order the machine got wrong.',
  img:I('dark'),time:'8 min ago',read:'6 min read',fmt:'read',au:'dv',feat:1,
  kp:['All three are piloting; none has an assistant placing unsupervised orders.','The blocker is returns liability, not model quality.','Reorder lists work. Discovery does not.'],
  body:P('Every large grocery platform in India is now building some version of an agentic assistant, and every one has stopped at the same wall: nobody wants to own the order the machine got wrong.',
   'The demos are good. Tell it you are cooking for six on Thursday and it builds a basket. In testing the baskets are sensible. The problem arrives at the doorstep, where a wrong substitution is not a model error — it is a refund, a rider, and a customer who now distrusts the app.',
   'So live deployments are narrow. Reorder assistance works, because the assistant matches against what you already bought. Discovery does not, because the platform cannot defend a recommendation it cannot explain.',
   'One head of product put it plainly: the assistant may fill the cart, but a human presses buy. Until the returns maths changes, that is where this sits.',
   'Watch the substitution logic, not the chat interface. That is the part that decides whether any of this survives a Thursday evening.')},

 {id:'pricing-engine',sec:'technology',tag:'TECHNOLOGY',t:'The pricing engine quietly running India\'s quick-commerce war',
  dek:'Prices on the three big apps move several times a day, per dark store. Almost none of it is a person.',
  img:I('aisle'),time:'4 hr ago',read:'7 min read',fmt:'read',au:'dv',
  kp:['Prices reprice multiple times a day, per store.','Competitor scraping is continuous and mutual.','Margin floors are set per category, not per SKU.'],
  body:P('The visible part of the price war is a ₹2 handling fee. The invisible part is a repricing system watching competitors continuously and moving prices per dark store, several times a day.',
   'Each platform scrapes the others. All of them know this. A cut in one catchment propagates within the hour, which is why these wars escalate faster than anyone intends.',
   'The guardrail is a margin floor set per category rather than per SKU, so a platform can go negative on onions if the basket recovers on staples.',
   'That one design decision is why a price war can run six days without anybody technically approving a loss.')},

 {id:'forecast-waste',sec:'technology',tag:'TECHNOLOGY',t:'Demand forecasting cut fresh waste by a third — at two companies out of nine',
  dek:'The models work. Most deployments fail upstream of the model, in data nobody owns.',
  img:I('salad'),time:'1 day ago',read:'5 min read',fmt:'read',au:'dv',
  kp:['Two of nine deployments hit their waste target.','Failures trace to late inbound data, not model choice.','Override rights decide the outcome.'],
  body:P('Nine companies told us they deployed demand forecasting on fresh. Two hit their waste-reduction target. The gap is not the model.',
   'The failures share a pattern: inbound supply data entered late, manually, or not at all. A forecast fed yesterday\'s truck as though it arrived on time is confidently wrong.',
   'The second pattern is override rights. Where store managers could freely override, they did — roughly 40% of the time — and waste stayed flat. Where an override needed a reason code, usage dropped and the numbers moved.',
   'That is a management change wearing a technology badge.')},
 {id:'zomato-burger',sec:'brands',tag:'JUST IN',t:'Zomato launches new burger brand across 10 cities',
  dek:'The new brand will operate under a cloud kitchen model, starting with Bengaluru, Delhi and Mumbai.',
  img:I('burger'),time:'2 min ago',read:'1 min read',fmt:'watch',dur:'42 sec',au:'km',feat:1,
  kp:['10 cities at launch; Bengaluru, Delhi and Mumbai go first.','Cloud-kitchen only — no storefront capex.','Burgers are the second-fastest growing category on Zomato\'s own app this year.'],
  body:P('Zomato is launching a burger brand of its own, built entirely on cloud kitchens, with 10 cities in the first phase. Bengaluru, Delhi and Mumbai open this month. The rest follow over the quarter.',
   'The economics are the point. A dine-in burger chain spends on rent, fit-out and staff before it sells anything. A cloud kitchen riding on capacity the company already leases spends almost none of that, and the delivery rails are already owned.',
   'Three people familiar with the plan say the brand will sit in the ₹180–260 band — above the QSR value menus, below the imported-patty specialists. That is deliberate. It is the band where orders on the app grew fastest last year and where no single chain has taken the category.',
   'What it does not do is threaten McDonald\'s or Burger King directly. Those chains sell footfall and family occasions as much as food. The pressure lands instead on the mid-market: the 20-to-60-outlet regional chains that took delivery seriously late and are now paying commission on orders they used to own.',
   'The open question is supply. A patty programme at this scale needs a cold chain that holds in July, and the company has not said who is making them.')},

 {id:'zepto-store',sec:'retail',tag:'RETAIL',t:'Zepto\'s new store format is a bet on fresh produce',
  dek:'Bigger floor, shorter aisles, and a cold chain built for 10-minute delivery.',
  img:I('store'),time:'32 min ago',read:'2 min read',fmt:'watch',dur:'2:48',au:'ra',feat:1,
  kp:['Store floor is roughly 2.5× the standard dark store.','Fresh produce moves from 4% of the basket to a target of 18%.','Only viable in catchments with 3,000+ daily orders.'],
  body:P('The new Zepto format is bigger, colder and slower to build — and that is the whole idea. Fresh produce is the category that keeps a grocery customer coming back weekly rather than monthly, and it is the one quick commerce has been worst at.',
   'Walk one and the difference is obvious. The aisles are shorter, so a picker\'s longest walk drops. A third of the floor is refrigerated, against almost none in a standard dark store. There is a sorting bench, which no dark store has, because produce arrives ungraded and leaves graded.',
   'Company material puts fresh at about 4% of the current basket, with a target near 18%. That is not a nudge. It is a different business, with spoilage risk attached.',
   'It only works in dense catchments. Below roughly 3,000 orders a day, the refrigeration and the extra staff do not pay for themselves, which is why this is a format for a few hundred locations, not a few thousand.')},

 {id:'salad-42cr',sec:'money',tag:'MONEY',t:'Salad-based D2C brand raises ₹42 Cr in Series B',
  dek:'Series B led by an existing investor. The chain is at 34 outlets and says it is contribution-positive in Bengaluru.',
  img:I('salad'),time:'2 hr ago',read:'1 min read',fmt:'read',au:'sn',feat:1,
  kp:['₹42 Cr, led by an existing investor.','34 outlets; contribution-positive in Bengaluru only.','Money goes to a second kitchen, not new cities.'],
  body:P('A ₹42 crore Series B into a salad chain sounds like 2021. It is not. The round is led by an existing investor, at a flat-to-modest step up, and the money is earmarked for a second central kitchen rather than a land grab.',
   'The chain is at 34 outlets. It says contribution margin is positive in Bengaluru and roughly breakeven in Hyderabad. Delhi is not mentioned, which usually means Delhi is not working yet.',
   'Investors are back on food service, but only where the unit economics are already proven in at least one city. The days of funding a 60-city rollout off one good store are gone.')},

 {id:'dmart-qc',sec:'retail',tag:'RETAIL',t:'DMart expands into quick commerce',
  dek:'A Pune-only pilot, 2-hour slots, no 10-minute promise. Deliberately unflashy.',
  img:I('aisle'),time:'3 hr ago',read:'1 min read',fmt:'read',au:'ra',
  kp:['Pune only, 2-hour delivery slots.','No dark stores — it picks from existing shops.','Priced at shelf price, no delivery surcharge under ₹999.'],
  body:P('DMart has started a quick-commerce pilot in Pune, and everything about it is designed to be boring. Two-hour slots, not ten minutes. Picking out of existing stores, not new dark stores. Shelf price, no surcharge above a ₹999 basket.',
   'That is a real strategy, not timidity. DMart\'s entire advantage is cost. Ten-minute delivery destroys cost. A two-hour window lets one picker batch eight orders and keeps the promise inside what a store can already do.',
   'If it works, the pressure on Blinkit and Instamart is not on speed. It is on price, in the weekly-stock-up basket where DMart has never been beaten.')},

 {id:'protein-choc',sec:'trends',tag:'TRENDS',t:'Why protein chocolates are suddenly everywhere',
  dek:'Nine launches in six months. Two of them from companies that made only whey a year ago.',
  img:I('choc'),time:'5 hr ago',read:'1 min read',fmt:'read',au:'km',
  kp:['Nine launches in six months.','Gym-channel distribution is the real asset, not the recipe.','Retail margins are roughly double a standard bar.'],
  body:P('Nine protein chocolate launches in six months is not a trend, it is a queue. And most of them are not chocolate companies.',
   'The reason is distribution. A whey brand already sells into 4,000 gyms and a handful of pharmacy chains. A bar at ₹99 with 10g of protein moves through that pipe without a single new conversation. The recipe is contract-manufactured.',
   'Margins help. A standard ₹20 chocolate bar leaves a retailer a few rupees. A protein bar at ₹99 leaves several times that, and takes the same shelf space.',
   'The thing to watch is repeat rate at month four. Novelty carries the first three.')},

 {id:'yogabar-500',sec:'founders',tag:'FOUNDER TAKE',t:'From a home kitchen to 500 stores — the Yogabar journey',
  dek:'The founder on saying no to modern trade for two years, and why that was the right call.',
  img:I('founder2'),time:'6 hr ago',read:'3 min',fmt:'watch',dur:'3:12',au:'km',
  kp:['Refused modern trade for the first two years.','Built on one SKU until it hit repeat targets.','Now at roughly 500 stores.'],
  body:P('"We said no to every large-format retailer for two years," she says, which at the time read as either discipline or arrogance. It was discipline.',
   'The argument: a shelf in modern trade costs listing fees, slotting and a returns liability, and it teaches you nothing about whether people actually want the product. A single SKU in 40 independent stores teaches you everything, at a fraction of the cost.',
   'They held one SKU until repeat purchase cleared an internal bar. Only then did the range widen, and only then did the big chains get a yes.',
   'Five hundred stores later, the sequencing is the lesson, not the number.')},

 {id:'fssai-labels',sec:'policy',tag:'POLICY',t:'FSSAI tightens front-of-pack labelling rules',
  dek:'Front-of-pack warnings move from voluntary to mandatory on a 2027 timeline.',
  img:I('coffee'),time:'8 hr ago',read:'2 min read',fmt:'read',au:'ra',
  kp:['Voluntary becomes mandatory, phased to 2027.','Sugar, salt and saturated fat thresholds tighten.','Reformulation windows are the real cost.'],
  body:P('The change most companies will feel is not the label. It is the reformulation clock behind it.',
   'Thresholds for sugar, salt and saturated fat tighten, and products above them carry a front-of-pack mark. Anyone who has reformulated a mass-market snack knows the honest timeline: 9 to 14 months for a recipe that survives consumer testing, longer if it changes the supply chain.',
   'A 2027 deadline sounds distant. For a company with 60 SKUs above threshold, it is not.')},

 {id:'matcha-crunch',sec:'global',tag:'GLOBAL',t:'Matcha shortage reaches Indian cafés',
  dek:'Japanese supply is short; café menus are quietly repricing.',
  img:I('matcha'),time:'9 hr ago',read:'1 min read',fmt:'watch',dur:'1:36',au:'km',
  kp:['Ceremonial-grade landed cost up sharply this year.','Cafés are reformulating rather than repricing.','Substitution to Chinese and Indian-grown leaf is starting.'],
  body:P('Matcha got popular faster than tencha can be grown, and tencha takes years. That is the whole story, and Indian cafés are now at the end of it.',
   'Most are not raising the menu price. They are quietly moving from ceremonial to culinary grade, cutting the dose, or blending. The drink survives; the purists notice.',
   'Some roasters are testing Chinese and Indian-grown leaf. It is not the same product, and everyone involved knows it.')},

 {id:'blinkit-pause',sec:'breaking',tag:'BREAKING',t:'Blinkit pauses its 10-minute grocery pilot in two cities',
  dek:'The company calls it a "route optimisation reset". Riders were being paid per trip on routes that could not be run.',
  img:I('dark'),time:'11 hr ago',read:'1 min read',fmt:'read',au:'ra',
  kp:['Two cities paused, not shut.','Rider pay structure is being reworked.','No change to the core 10-minute promise elsewhere.'],
  body:P('A pause in two cities is not a retreat, but it is an admission. The routes being promised could not be run inside the window without either speeding or unpaid waiting, and both showed up in rider churn.',
   'The company frames it as route optimisation. The fix on the table is a per-hour floor rather than pure per-trip pay in the affected zones.',
   'The 10-minute promise elsewhere is unchanged, which tells you this is an operations problem in specific catchments, not a rethink of the model.')},

 {id:'itc-protein',sec:'brands',tag:'BRANDS',t:'ITC to enter protein snacks category',
  dek:'A distribution-first entry: the product is unremarkable, the shelf access is not.',
  img:I('choc'),time:'12 min ago',read:'1 min read',fmt:'read',au:'km',
  kp:['Launch through existing ITC distribution, not a new brand build.','Targets the ₹99–₹149 band.','Puts pressure on challenger brands\' only real moat.'],
  body:P('When ITC enters a category, the product is rarely the news. The distribution is.',
   'Challenger protein brands have spent four years building gym and pharmacy reach one conversation at a time. ITC has a route to about 6 million outlets already paid for. A comparable bar at ₹99 does not need to be better to hurt.',
   'What the challengers still hold is credibility with the actual gym-going buyer, which is a small market that sets the taste for a much larger one.')},

 {id:'zepto-farmley',sec:'brands',tag:'BRANDS',t:'Zepto partners with Farmley for private label range',
  dek:'A dried-fruit range under Zepto\'s own brand, made by Farmley.',
  img:I('salad'),time:'28 min ago',read:'1 min read',fmt:'read',au:'ra',
  kp:['Private label, manufactured by Farmley.','Dried fruit is high margin and low spoilage — the obvious first category.','Brands on the platform now compete with their own contract manufacturer.'],
  body:P('Dried fruit is the correct first private label for a quick-commerce platform: high margin, long shelf life, no cold chain, and the customer does not have a strong brand preference.',
   'The awkward part is structural. Farmley sells its own branded range on the same app it now manufactures a competitor for. Every platform that has gone down this road has ended up in the same conversation about shelf placement and search ranking.',
   'Expect the third-party brands to raise it long before the regulator does.')},

 {id:'mcd-menu',sec:'brands',tag:'BRANDS',t:'McDonald\'s tests new menu in India',
  dek:'A regional-flavour platform, tested in 40 outlets in the west.',
  img:I('burger'),time:'2 hr ago',read:'1 min read',fmt:'read',au:'km',
  kp:['40-outlet test in western India.','Regional flavour platform, not new formats.','Price band unchanged.'],
  body:P('Forty outlets is a real test, not a PR launch. The platform is flavour-led rather than format-led — the same builds, different seasonings and sauces, which keeps kitchen complexity flat.',
   'That constraint is the interesting part. Anything that adds a step to the line at lunch does not survive contact with a Saturday rush, so the winning items are almost always the ones that change nothing about assembly.')},

 {id:'packaged-100bn',sec:'money',tag:'MONEY',t:'India\'s packaged food market to hit $100 Bn by 2030',
  dek:'The headline number is fine. The mix underneath it is the story.',
  img:I('aisle'),time:'1 hr ago',read:'2 min read',fmt:'listen',dur:'4:10',au:'sn',
  kp:['$100 Bn by 2030 on the base case.','Growth is concentrated in ready-to-cook and healthier snacking.','Staples grow with population, not preference.'],
  body:P('Every few months a new forecast puts Indian packaged food at $100 billion by 2030. Treat the headline as directional and read the mix.',
   'Staples grow roughly with population and income. The interesting growth sits in ready-to-cook, chilled and what the decks call better-for-you snacking — categories where a new brand can actually take share because habits are not yet set.',
   'For anyone allocating capital, the number that matters is not the market size. It is how much of the growth is available to a company that does not already own distribution.')},

 {id:'iced-coffee',sec:'trends',tag:'TRENDING',t:'Why iced coffee is India\'s next big beverage bet',
  dek:'Cold coffee stopped being a dessert and started being a daily drink.',
  img:I('coffee'),time:'18 min ago',read:'1 min read',fmt:'watch',dur:'36 sec',au:'km',feat:1,
  kp:['Cold formats now a third of café coffee volume in metros.','Ready-to-drink is growing faster than café.','Sugar levels are the category\'s medium-term risk.'],
  body:P('Cold coffee in India used to be a milkshake with a coffee note, sold as a treat. The current version is closer to what the drink is elsewhere: less sugar, more coffee, bought on a weekday.',
   'Cold formats are now around a third of café coffee volume in the metros, and ready-to-drink is growing faster still because it travels into general trade where a café never will.',
   'The risk is the same one that caught flavoured yoghurt: the versions that sell fastest are the sweetest, and the labelling rules are moving the other way.')},

 {id:'noodle-slump',sec:'products',tag:'PRODUCTS',t:'Instant noodle volumes fall 8% in Q2',
  dek:'Not a health story. A price story.',
  img:I('dark'),time:'1 day ago',read:'1 min read',fmt:'read',au:'sn',
  kp:['Volumes down 8%, value roughly flat.','Pack sizes shrank before prices rose.','Rural is where the volume went.'],
  body:P('Volumes down 8%, value roughly flat: that is a grammage story, not a wellness one. Packs got smaller before prices went up, and the shopper noticed on the second purchase rather than the first.',
   'Most of the decline is rural, where the price per pack matters more than the price per gram, and where a ₹5 step is a real decision.')},

 {id:'reliance-fresh',sec:'retail',tag:'RETAIL',t:'Reliance opens 50 new fresh stores this year',
  dek:'Smaller footprint, produce-heavy, sited near the dense residential clusters quick commerce already serves.',
  img:I('store'),time:'32 min ago',read:'1 min read',fmt:'read',au:'ra',
  kp:['50 stores planned this year.','Smaller format than the earlier fresh stores.','Sited to double as fulfilment points.'],
  body:P('The new fresh stores are smaller than the last generation and sited unusually close to each other in dense residential pockets. That is not a retail decision alone — those locations double as fulfilment points.',
   'Run the same square footage twice, once as a shop and once as a picking node, and the rent maths changes completely. This is the quiet advantage incumbents have over pure-play dark store networks.')}

/* ------------------------------------------------ ROUTER */
function go(spec){
  const [v,arg]=String(spec).split(':');
  S.route={v,arg};
  render();
  const sc=document.body.classList.contains('m')?$('#phScroll'):window;
  if(sc===window)window.scrollTo({top:0,behavior:'instant'}); else sc.scrollTop=0;
}
function render(){
  const {v,arg}=S.route;
  const html = v==='section'?V.section(arg) : v==='story'?V.story(arg) : v==='author'?V.author(arg)
    : v==='search'?V.search(decodeURIComponent(arg||'')) : (V[v]||V.home)();
  $('#app').innerHTML=html;
  $$('#mainNav button').forEach(b=>b.classList.toggle('on', b.dataset.go===('section:'+arg) || (v==='home'&&b.dataset.go==='home') || b.dataset.go===v));
  $$('#phNav button').forEach(b=>b.classList.toggle('on', b.dataset.go===v || (v==='home'&&b.dataset.go==='home')));
  const sb=$('#signBtn'); if(sb)sb.textContent=S.member?'My account':'Sign In';
  wire();
}

$('#mainNav').innerHTML=`<button data-go="home" class="on">Home</button>`+
  SECTIONS.map(s=>`<button data-go="${['videos','podcasts'].includes(s.id)?s.id:'section:'+s.id}">${s.name}</button>`).join('')+

/* global click delegation */
document.addEventListener('click',e=>{
  const go_=e.target.closest('[data-go]'); const st=e.target.closest('[data-story]');
  const sv=e.target.closest('[data-save]');
  if(sv){e.stopPropagation();const id=sv.dataset.save;S.saved.has(id)?S.saved.delete(id):S.saved.add(id);render();return}
  if(st){go('story:'+st.dataset.story);return}
  if(go_){go(go_.dataset.go);return}
  const vd=e.target.closest('[data-video]'); if(vd){openModal(`<h3>${esc(vd.dataset.video)}</h3>
    <p class="s">Player is a placeholder in the prototype.</p>
    <div style="height:210px;border-radius:12px;background:#111;display:grid;place-items:center;color:#fff;font-size:34px">▶</div>
    <div style="margin-top:14px;display:flex;gap:8px"><button class="btn-sub" data-close>Close</button>
      <button class="speed" data-go="shorts">Open vertical feed</button></div>`);}
  const pd=e.target.closest('[data-pod]'); if(pd){const p=PODS.find(x=>x.id===pd.dataset.pod);
    openModal(`<h3>${esc(p.t)}</h3><p class="s">${p.day} · ${p.len}</p>${briefBlock(p)}
      <button class="btn-sub" data-close>Close</button>`); wire();}
  if(e.target.closest('[data-close]')||e.target.classList.contains('overlay'))closeModal();
});

/* ------------------------------------------------ PER-RENDER WIRING */
function wire(){
  /* latest feed */
  const feedEl=$('#feedList');
  if(feedEl){
    const list=STORIES.slice(0,5);
    const draw=arr=>feedEl.innerHTML=arr.map((s,i)=>`<button class="it ${i?'':'new'}" data-story="${s.id}"><time>${s.time}</time><p>${esc(s.t)}</p></button>`).join('');
    draw(list);
    $('#moreBtn').onclick=e=>{draw(STORIES.slice(0,9));e.target.textContent="That's everything for now";e.target.disabled=true};
  }
  /* chips */
  $$('[data-chip]').forEach(c=>c.onclick=()=>{
    $$('[data-chip]').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    const k=c.dataset.chip;
    const list=k==='all'?STORIES.slice(2,6):STORIES.filter(s=>s.sec===k||s.tag.toLowerCase()===k);
    $('#stories').innerHTML=(list.length?list:STORIES.slice(2,6)).slice(0,4).map(storyCard).join('');
  });
  /* ask */
  $$('[data-ask] button').forEach(b=>b.onclick=()=>{
    const box=b.closest('.ask').querySelector('[data-ansbox]');
    box.innerHTML=`<div class="typing"><b></b><b></b><b></b></div>`;
    setTimeout(()=>{box.innerHTML=`<div class="k">ANSWERED FROM SNACKFAX REPORTING</div><b>${b.textContent}</b>
      <ul>${ANSWERS[b.textContent].map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="src">Sources: 3 Snackfax stories, 28 Sep · <u>see them</u></div>`},650);
  });
  /* polls */
  $$('[data-poll]').forEach(root=>{
    const id=root.dataset.poll;
    $$('.opt',root).forEach(o=>o.onclick=()=>{
      if(S.voted[id])return; S.voted[id]=1; root.classList.add('voted');
      $$('.opt',root).forEach(x=>x.querySelector('.fill').style.width=x.dataset.p+'%');
      o.style.borderColor='var(--red)';
      const t=root.querySelector('.tot'); if(t)t.textContent='4,183 votes • you voted';
    });
  });
  /* players */
  $$('[data-player]').forEach(root=>initPlayer(root));
  /* swipe deck */
  const deck=$('#deck'); if(deck)initDeck();
  /* live log */
  if($('#liveLog'))drawLog();
  /* subscribe forms */
  $$('[data-sub]').forEach(f=>f.onsubmit=e=>{e.preventDefault();
    const m=f.parentElement.querySelector('[data-submsg]'); if(m)m.textContent="You're in. First brief lands tomorrow 6.30am.";
    f.reset();});
  $$('.wa .jn').forEach(b=>b.onclick=()=>{b.textContent='Joined ✓';b.style.color='var(--ink-3)'});
  $$('[data-fakeplay]').forEach(b=>b.onclick=()=>{b.textContent=b.textContent==='▶'?'❚❚':'▶'});
  /* hero rotation only on home */
  if($('#heroBig'))startHero();
}

/* audio player */
const timers=[];
function initPlayer(root){
  const p=PODS.find(x=>x.id===root.dataset.player)||PODS[0];
  const wave=root.querySelector('[data-wave')||root.querySelector('[data-wave]');
  const BARS=52;
  wave.innerHTML=Array.from({length:BARS},()=>`<b style="height:${18+Math.random()*82}%"></b>`).join('');
  let t=0,playing=false,spd=1;
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  const paint=()=>{
    const pr=t/p.secs; $$('b',wave).forEach((b,i)=>b.classList.toggle('p',i/BARS<=pr));
    root.querySelector('[data-tcur]').textContent=fmt(t);
    let idx=0;p.chapters.forEach((c,i)=>{if(t>=c[1])idx=i});
    root.querySelector('[data-chapnow]').textContent=p.chapters[idx][0];
    $$('[data-chaps] button',root).forEach((b,i)=>b.classList.toggle('on',i===idx));
  };
  paint();
  root.querySelector('[data-pp]').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'❚❚':'▶'};
  root.querySelector('[data-spd]').onclick=e=>{spd=spd===1?1.5:spd===1.5?2:1;e.currentTarget.textContent=spd.toFixed(1)+'×'};
  $$('[data-chaps] button',root).forEach((b,i)=>b.onclick=()=>{t=p.chapters[i][1];paint()});
  wave.onclick=e=>{const r=wave.getBoundingClientRect();t=Math.round((e.clientX-r.left)/r.width*p.secs);paint()};
  timers.push(setInterval(()=>{if(playing){t=Math.min(p.secs,t+spd);paint();if(t>=p.secs){playing=false;root.querySelector('[data-pp]').textContent='▶'}}},1000));
}

/* swipe deck */
const CARDS=['salad-42cr','dmart-qc','protein-choc','fssai-labels','matcha-crunch','zepto-farmley'].map(byId);
function initDeck(){
  const draw=()=>{
    const d=$('#deck'); if(!d)return;
    const slice=CARDS.slice(S.deck,S.deck+3);
    d.innerHTML=slice.length?slice.slice().reverse().map((c,n,arr)=>{
      const depth=arr.length-1-n;
      return `<div class="sw" style="transform:translateY(${depth*10}px) scale(${1-depth*.04});opacity:${depth>1?.5:1};z-index:${10-depth}">
        <span class="tag ${TAGC[c.tag]||''}" style="align-self:flex-start">${c.tag}</span>
        <h3>${esc(c.t)}</h3><p>${esc(c.dek)}</p><div class="n">${S.deck+1} of ${CARDS.length}</div></div>`}).join('')
      : `<div class="sw" style="align-items:center;justify-content:center;text-align:center">
         <h3>Done for today</h3><p>${S.deckSaved} saved to read properly.</p>
         <div class="n" style="margin-top:14px"><button class="btn-sub" data-go="saved">Open saved →</button></div></div>`;
    const c=$('#deckCount'); if(c)c.textContent=S.deckSaved?`${S.deckSaved} saved`:'Swipe or use the buttons';
  };
  draw();
  $('#skip').onclick=()=>{if(S.deck<CARDS.length){S.deck++;draw()}};
  $('#save').onclick=()=>{if(S.deck<CARDS.length){S.saved.add(CARDS[S.deck].id);S.deck++;S.deckSaved++;draw()}};
}

/* live log */
let liveExtra=0;
function drawLog(){
  const el=$('#liveLog'); if(!el)return;
  el.innerHTML=LIVE.log.map((e,i)=>`<div class="e ${e[2]?'hot':''} ${i===0&&e[3]?'fresh':''}"><time>${e[0]}</time><p>${esc(e[1])}</p></div>`).join('');
}
setInterval(()=>{
  if(liveExtra<LIVE_NEW.length){LIVE.log.unshift([...LIVE_NEW[liveExtra++],1]);LIVE.log[0][3]=1;drawLog()}
},9000);

/* hero rotation */
let heroTimer=null,hi=0;
function startHero(){
  clearInterval(heroTimer);
  const feat=STORIES.filter(s=>s.feat);
  heroTimer=setInterval(()=>{
    const el=$('#heroBig'); if(!el){clearInterval(heroTimer);return}
    hi=(hi+1)%feat.length; const s=feat[hi];
    el.style.setProperty('--img',`url('${s.img}')`);
    el.dataset.story=s.id;
    el.querySelector('h1').textContent=s.t; el.querySelector('p').textContent=s.dek;
    const pl=el.querySelector('.play');
    if(pl)pl.innerHTML=`<i>${s.fmt==='watch'?'▶':s.fmt==='listen'?'◎':'▤'}</i> ${s.fmt==='watch'?'Watch '+s.dur:s.fmt==='listen'?'Listen '+s.dur:s.read}`;
    el.querySelector('.tag').textContent=s.tag; el.querySelector('.stamp').textContent='🕐 '+s.time;
    $$('#heroDots b').forEach((b,n)=>b.classList.toggle('on',n===hi));
  },6000);
}

/* ticker */
const TK=[['ITC','to enter protein snacks category','itc-protein'],['Zepto','partners with Farmley for private label','zepto-farmley'],
  ['DMart','begins quick-commerce pilot in Pune','dmart-qc'],['McDonald\'s','tests a new India menu','mcd-menu'],
  ['Blinkit','pauses 10-minute pilot in two cities','blinkit-pause']];
$('#tk').innerHTML=TK.map((t,i)=>`<button class="${i?'':'on'}" data-story="${t[2]}"><b>${t[0]}</b> ${t[1]}</button>`).join('');
let ti=0;
setInterval(()=>{const s=$$('#tk button');s[ti].classList.remove('on');ti=(ti+1)%s.length;s[ti].classList.add('on')},3200);

/* reading progress */
const onScroll=el=>{
  const top=el===window?window.scrollY:el.scrollTop;
  const h=el===window?document.body.scrollHeight-innerHeight:el.scrollHeight-el.clientHeight;
  $('#prog').style.width=Math.min(100,Math.max(0,top/(h||1)*100))+'%';
};
window.addEventListener('scroll',()=>onScroll(window));

/* view toggle — moves the same app between shells */
$$('#viewSeg button').forEach(b=>b.onclick=()=>{
  $$('#viewSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const mobile=b.dataset.v==='m';
  document.body.classList.toggle('m',mobile);
  (mobile?$('#phScroll'):$('#appSlot')).appendChild($('#app'));
  if(mobile)$('#phScroll').addEventListener('scroll',()=>onScroll($('#phScroll')));
  window.scrollTo(0,0); render();
});

/* boot */
$('#appSlot').appendChild($('#app'));
go('home');
</script>
